<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Photography</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <header>
        <nav>
            <h1>Alpine Lens</h1>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-text">
            <h2>Capturing the Majesty of Mountains</h2>
            <p>A visual journey through peaks, valleys, and skies.</p>
        </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="gallery">
        <h2>My Shots</h2>
        
        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="snow">Snow Peaks</button>
            <button class="filter-btn" data-filter="sunset">Sunsets</button>
        </div>

        <!-- Photo Grid -->
        <div class="photo-grid">
            <div class="photo-card" data-category="snow"><img src="mountain1.jpg" alt="Snow Mountain 1"></div>
            <div class="photo-card" data-category="sunset"><img src="mountain2.jpg" alt="Sunset Mountain"></div>
            <div class="photo-card" data-category="snow"><img src="mountain3.jpg" alt="Snow Mountain 2"></div>
        </div>
    </section>

    <!-- Lightbox Modal (Popup for images) -->
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-img" id="lightbox-img" src="" alt="Zoomed Photo">
    </div>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
    <div>
    <h2>My Mountain Photos</h2>
<img width="738" height="1599" alt="photo2 jpg" src="https://github.com/user-attachments/assets/87960138-dadc-4f17-817a-97ba57c9e5fe" />
<img width="738" height="1599" alt="photo1 jpg" src="https://github.com/user-attachments/assets/8421f556-7a30-47ab-b8ea-384590d9a0ec" />
<img width="1599" height="738" alt="photo13jpg" src="https://github.com/user-attachments/assets/7c3a5f22-f59b-4876-984e-4e7c16870f06" />
<img width="1599" height="1200" alt="photo4 jpg" src="https://github.com/user-attachments/assets/05c6daad-3bae-4529-806b-3b0b66e9bd98" />

    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
         alt="Mountain"
         width="400">

</div>
</body>
</html>
