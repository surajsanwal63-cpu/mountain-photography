<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Photography Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* Welcome Popup Modal */
        #welcome-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-box h2 {
            margin-bottom: 12px;
            font-size: 1.8rem;
            color: #fff;
        }

        .modal-box p {
            color: #ddd;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .modal-box input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            font-size: 1rem;
        }

        .modal-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff8a00, #e52e71);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(229, 46, 113, 0.4);
            transition: 0.3s;
        }

        .modal-box button:hover {
            transform: scale(1.02);
        }

        /* Header Styling */
        header {
            padding: 40px 0;
        }

        h1 {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff8a00, #e52e71, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(229, 46, 113, 0.3);
        }

        header p {
            font-size: 1.2rem;
            color: #e0e0e0;
            letter-spacing: 1px;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .photo-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s ease;
        }

        .photo-card:hover {
            transform: translateY(-8px);
        }

        .photo-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .photo-title {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* Footer */
        footer {
            margin-top: 60px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.95rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <!-- Welcome Popup Modal -->
    <div id="welcome-modal">
        <div class="modal-box">
            <h2>Welcome</h2>
            <p>Please enter your name and 10-digit mobile number to proceed.</p>
            <form onsubmit="validateAndOpen(event)">
                <input type="text" id="user-name" placeholder="Enter your name" required>
                <input type="tel" id="user-phone" placeholder="Enter 10-digit mobile number" required pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number">
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <!-- Website Header -->
    <header>
        <h1>Mountain Photography</h1>
        <p>पहाड़ों की ऊँचाइयों और खूबसूरत वादियों का सफर</p>
    </header>

    <!-- Photo Gallery -->
    <div class="gallery">
        <div class="photo-card">
            <img src="https://github.com/user-attachments/assets/87960138-dadc-4f17-817a-97ba57c9e5fe" alt="Dumak Valley">
            <p class="photo-title">Dumak Valley View</p>
        </div>
        <div class="photo-card">
            <img src="https://github.com/user-attachments/assets/8421f556-7a30-47ab-b8ea-384590d9a0ec" alt="Sunrise">
            <p class="photo-title">Snow Mountain Sunrise</p>
        </div>
        <div class="photo-card">
            <img src="https://github.com/user-attachments/assets/7c3a5f22-f59b-4876-984e-4e7c16870f06" alt="Ranges">
            <p class="photo-title">Himalayan Ranges</p>
        </div>
        <div class="photo-card">
            <img src="https://github.com/user-attachments/assets/05c6daad-3bae-4529-806b-3b0b66e9bd98" alt="Green Hills">
            <p class="photo-title">Green Hills & Clouds</p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Mountain Photography | Designed with ❤️</p>
    </footer>

    <!-- JavaScript Validation -->
    <script>
        function validateAndOpen(event) {
            event.preventDefault();
            var phone = document.getElementById('user-phone').value;
            
            if(phone.length === 10 && !isNaN(phone)) {
                document.getElementById('welcome-modal').style.display = 'none';
            } else {
                alert('Please enter a valid 10-digit mobile number!');
            }
        }
    </script>
</body>
</html>
