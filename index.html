<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Photography</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Welcome Popup Modal -->
    <div id="welcome-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px);">
        <div style="background: rgba(255, 255, 255, 0.12); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.3); text-align: center; width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
            <h2 style="color: #ffffff; margin-bottom: 12px; font-size: 1.8rem;">Welcome</h2>
            <p style="color: #e0e0e0; font-size: 1rem; margin-bottom: 25px; line-height: 1.4;">Please enter your name and 10-digit mobile number to proceed.</p>
            
            <form onsubmit="validateAndOpen(event)">
                <input type="text" id="user-name" placeholder="Enter your name" required style="width: 100%; padding: 12px 15px; margin-bottom: 18px; border-radius: 10px; border: none; outline: none; background: rgba(255,255,255,0.95); font-size: 1rem; box-sizing: border-box;">
                
                <input type="tel" id="user-phone" placeholder="Enter 10-digit mobile number" required pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number" style="width: 100%; padding: 12px 15px; margin-bottom: 22px; border-radius: 10px; border: none; outline: none; background: rgba(255,255,255,0.95); font-size: 1rem; box-sizing: border-box;">
                
                <button type="submit" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #ff8a00, #e52e71); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(229, 46, 113, 0.4);">Submit</button>
            </form>
        </div>
    </div>

    <!-- Main Website Content -->
    <header style="padding: 40px 0;">
        <h1>Mountain Photography</h1>
        <p>पहाड़ों की ऊँचाइयों और खूबसूरत वादियों का सफर</p>
    </header>

    <div class="gallery">
        <div class="photo-card">
            <img src="https://github.com/user-attachments/assets/87960138-dadc-4f17-817a-97ba57c9e5fe" alt="photo1">
            <p class="photo-title">Dumak Valley View</p>
        </div>
    </div>

    <script>
        function validateAndOpen(event) {
            event.preventDefault();
            var phone = document.getElementById('user-phone').value;
            
            if(phone.length === 10 && !isNaN(phone)) {
                document.getElementById('welcome-modal').style.display = 'none';
            } else {
                alert('Please enter a valid 10-digit mobile number!');
            }
        }
    </script>
</body>
</html>
